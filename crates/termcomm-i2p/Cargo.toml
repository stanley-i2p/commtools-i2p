[package]
name = "termcomm-i2p"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arboard = { version = "3.6.1", default-features = false }
commtools-core = { path = "../commtools-core" }
commtools-runtime = { path = "../commtools-runtime" }
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tui-file-explorer = { version = "=0.9.8", default-features = false }
tui-tabs = "=0.1.1"
tui-textarea = { package = "tui-textarea-2", version = "=0.13.2" }
unicode-width = "0.2"
zeroize = "1"
