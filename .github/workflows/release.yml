name: Release builds

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build artifacts only or create a draft GitHub release
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - draft-release
      release_tag:
        description: Optional for build-only; required for draft-release (for example, v0.1.0)
        required: false
        type: string
      prerelease:
        description: Mark a created draft release as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          versions="$(
            cargo metadata \
              --manifest-path Cargo.toml \
              --no-deps \
              --locked \
              --format-version 1 \
              | jq -r '.packages[] | select(.name == "termcomm-i2p" or .name == "deskcomm-i2p") | "\(.name)=\(.version)"'
          )"
          termcomm_version="$(printf '%s\n' "$versions" | sed -n 's/^termcomm-i2p=//p')"
          deskcomm_version="$(printf '%s\n' "$versions" | sed -n 's/^deskcomm-i2p=//p')"

          if [[ -z "$termcomm_version" || -z "$deskcomm_version" ]]; then
            echo "Unable to read both client versions from workspace metadata." >&2
            exit 1
          fi
          if [[ "$termcomm_version" != "$deskcomm_version" ]]; then
            echo "Client versions differ: TermComm=$termcomm_version DeskComm=$deskcomm_version." >&2
            exit 1
          fi

          version="$termcomm_version"
          expected_tag="v${version}"
          release_tag="${REQUESTED_TAG:-$expected_tag}"
          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag '$release_tag' does not match workspace version '$expected_tag'." >&2
            exit 1
          fi

          if [[ "$REQUESTED_MODE" == "draft-release" ]]; then
            if [[ -z "${REQUESTED_TAG:-}" ]]; then
              echo "release_tag is required when creating a draft release." >&2
              exit 1
            fi
            if ! git show-ref --verify --quiet "refs/tags/$release_tag"; then
              echo "Tag '$release_tag' does not exist." >&2
              exit 1
            fi
            if [[ "$(git rev-list -n 1 "$release_tag")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag '$release_tag' does not point to the selected workflow revision." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  test-workspace:
    name: Test workspace (Debian 12)
    needs: metadata
    runs-on: ubuntu-24.04
    container: rust:1.92-bookworm
    permissions:
      contents: read

    steps:
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates \
            cmake \
            git \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test workspace
        run: cargo test --workspace --locked

  build-termcomm-linux:
    name: Build TermComm Linux x86_64 GNU (Debian 12)
    needs:
      - metadata
      - test-workspace
    runs-on: ubuntu-24.04
    container: rust:1.92-bookworm
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}

    steps:
      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends file git

      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Define artifact name
        id: names
        shell: bash
        run: echo "artifact_name=termcomm-i2p-${{ needs.metadata.outputs.release_tag }}-linux-x86_64-gnu" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --package termcomm-i2p

      - name: Package Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-linux.sh "${{ needs.metadata.outputs.version }}"

      - name: Validate Linux artifact and Debian 12 ABI baseline
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ needs.metadata.outputs.release_tag }}"
          archive="dist/termcomm-i2p-$release_tag-linux-x86_64-gnu.tar.gz"
          package="termcomm-i2p-$release_tag-linux-x86_64-gnu"
          binary="target/release/termcomm-i2p"

          test -s "$archive"
          file "$binary" | grep -Eq 'ELF 64-bit.*x86-64'
          file "$binary" | grep -q 'dynamically linked'
          max_glibc="$(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)"
          if [[ "$(printf '%s\n' "$max_glibc" 'GLIBC_2.36' | sort -V | tail -n 1)" != 'GLIBC_2.36' ]]; then
            echo "Binary requires $max_glibc, newer than the Debian 12 GLIBC_2.36 baseline." >&2
            exit 1
          fi
          rm -rf .linux-check
          mkdir -p .linux-check
          tar -xzf "$archive" -C .linux-check
          test -x ".linux-check/$package/termcomm-i2p"
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Upload TermComm Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  build-deskcomm-linux:
    name: Build DeskComm Linux x86_64 GNU (Debian 12)
    needs:
      - metadata
      - test-workspace
    runs-on: ubuntu-24.04
    container: rust:1.92-bookworm
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}

    steps:
      - name: Install Linux GUI and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --yes --no-install-recommends \
            cmake \
            desktop-file-utils \
            file \
            git \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Define artifact name
        id: names
        shell: bash
        run: echo "artifact_name=deskcomm-i2p-${{ needs.metadata.outputs.release_tag }}-linux-x86_64-gnu" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked --package deskcomm-i2p

      - name: Package Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-deskcomm-linux.sh "${{ needs.metadata.outputs.version }}"

      - name: Validate Linux artifact and Debian 12 ABI baseline
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ needs.metadata.outputs.release_tag }}"
          archive="dist/deskcomm-i2p-$release_tag-linux-x86_64-gnu.tar.gz"
          package="deskcomm-i2p-$release_tag-linux-x86_64-gnu"
          binary="target/release/deskcomm-i2p"

          test -s "$archive"
          file "$binary" | grep -Eq 'ELF 64-bit.*x86-64'
          file "$binary" | grep -q 'dynamically linked'
          ! ldd "$binary" | grep -q 'not found'
          max_glibc="$(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)"
          if [[ "$(printf '%s\n' "$max_glibc" 'GLIBC_2.36' | sort -V | tail -n 1)" != 'GLIBC_2.36' ]]; then
            echo "Binary requires $max_glibc, newer than the Debian 12 GLIBC_2.36 baseline." >&2
            exit 1
          fi
          rm -rf .linux-check
          mkdir -p .linux-check
          tar -xzf "$archive" -C .linux-check
          test -x ".linux-check/$package/deskcomm-i2p"
          desktop_entry=".linux-check/$package/share/applications/deskcomm-i2p.desktop"
          icon=".linux-check/$package/share/icons/hicolor/128x128/apps/deskcomm-i2p.png"
          test -f "$desktop_entry"
          test -f "$icon"
          desktop-file-validate "$desktop_entry"
          grep -qx 'Exec=deskcomm-i2p' "$desktop_entry"
          grep -qx 'Icon=deskcomm-i2p' "$desktop_entry"
          file "$icon" | grep -q 'PNG image data, 128 x 128'
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Upload DeskComm Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  build-termcomm-windows:
    name: Build TermComm Windows x86_64
    needs:
      - metadata
      - test-workspace
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Define artifact name
        id: names
        shell: pwsh
        run: |
          "artifact_name=termcomm-i2p-${{ needs.metadata.outputs.release_tag }}-windows-x86_64" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --release --locked --package termcomm-i2p
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows artifact
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ needs.metadata.outputs.version }}"

      - name: Validate Windows artifact
        shell: pwsh
        run: ./scripts/validate-windows-package.ps1 -Product "termcomm-i2p" -ReleaseTag "${{ needs.metadata.outputs.release_tag }}"

      - name: Upload TermComm Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  build-deskcomm-windows:
    name: Build DeskComm Windows x86_64
    needs:
      - metadata
      - test-workspace
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Define artifact name
        id: names
        shell: pwsh
        run: |
          "artifact_name=deskcomm-i2p-${{ needs.metadata.outputs.release_tag }}-windows-x86_64" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build release binary
        shell: pwsh
        run: |
          cargo build --release --locked --package deskcomm-i2p
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows artifact
        shell: pwsh
        run: ./scripts/package-deskcomm-windows.ps1 -Version "${{ needs.metadata.outputs.version }}"

      - name: Validate Windows artifact
        shell: pwsh
        run: ./scripts/validate-windows-package.ps1 -Product "deskcomm-i2p" -ReleaseTag "${{ needs.metadata.outputs.release_tag }}"

      - name: Upload DeskComm Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  create-draft-release:
    name: Create draft GitHub release
    if: ${{ inputs.mode == 'draft-release' }}
    needs:
      - metadata
      - build-termcomm-linux
      - build-deskcomm-linux
      - build-termcomm-windows
      - build-deskcomm-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download TermComm Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-termcomm-linux.outputs.artifact_name }}
          path: .release-input/termcomm-linux

      - name: Download DeskComm Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-deskcomm-linux.outputs.artifact_name }}
          path: .release-input/deskcomm-linux

      - name: Download TermComm Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-termcomm-windows.outputs.artifact_name }}
          path: .release-input/termcomm-windows

      - name: Download DeskComm Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-deskcomm-windows.outputs.artifact_name }}
          path: .release-input/deskcomm-windows

      - name: Validate and combine release artifacts
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ needs.metadata.outputs.release_tag }}"
          git show-ref --verify --quiet "refs/tags/$release_tag"
          test "$(git rev-list -n 1 "$release_tag")" = "$(git rev-parse HEAD)"

          for directory in .release-input/*; do
            (
              cd "$directory"
              sha256sum --check SHA256SUMS
            )
          done

          mkdir -p dist
          find .release-input -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp '{}' dist/ \;
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 4
          (
            cd dist
            sha256sum *.tar.gz *.zip > SHA256SUMS
          )

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists." >&2
            exit 1
          fi

          args=(
            --draft
            --generate-notes
            --title "CommTools-I2P $VERSION"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/*
